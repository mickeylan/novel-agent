server:
  host: "127.0.0.1"
  port: 8080
  mode: "debug"  # debug, release, test
  max_concurrent_ai: 4
  max_header_bytes: 65536

database:
  host: "127.0.0.1"
  port: 5432
  user: "novel_agent"
  password: ""  # 必须通过 DB_PASSWORD 或未提交的本地配置提供
  dbname: "novel_agent"
  sslmode: "disable"
  search_path: "novel_agent,public"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_seconds: 1800
  conn_max_idle_time_seconds: 300
  statement_timeout_ms: 15000
  connect_timeout_seconds: 10

llm:
  provider: "modelscope"  # modelscope, openai, ollama, sglang, llama
  api_key_file: "../secrets/modelscope.key"
  base_url: "https://coding.dashscope.aliyuncs.com/v1"
  model: "qwen3.5-plus"
  embedding_model: "bge-m3"
  temperature: 0.7
  max_tokens: 32000

vector:
  dimension: 1024
  index_type: "ivfflat"
  metric: "cosine"

embedding:
  provider: "openai"
  base_url: "http://10.0.0.200:8081"
  model: "bge-m3-Q4_K_M.gguf"
  dimension: 1024

logging:
  level: "info"
  format: "text"  # text, json
